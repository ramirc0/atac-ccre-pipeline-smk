# Local execution.
software-deployment-method:
  - conda
conda-prefix: .conda

cores: 64
printshellcmds: true
rerun-incomplete: true
keep-going: true
show-failed-logs: true
retries: 1
benchmark-extended: true

default-resources:          # fallback for trivial rules
  mem_mb: 2000
  runtime: 30

set-threads:                # also caps polars: rules export POLARS_MAX_THREADS={threads}
  prepare_peaks: 4
  filter_rpeaks: 4
  max_z: 8
  call_ccres: 4

set-resources:              # from benchmarks/; ENCODE-scale peak sets need ~3x
  prepare_peaks: {mem_mb: 20000}
  filter_rpeaks: {mem_mb: 64000}
  zscore: {mem_mb: 4000}
  call_ccres: {mem_mb: 4000}
  fragment_call_peaks: {mem_mb: 32000}
  fragment_bigwig: {mem_mb: 16000}
