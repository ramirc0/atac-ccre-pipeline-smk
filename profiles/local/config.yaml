# Local execution.
software-deployment-method:
  - conda
conda-prefix: .conda

cores: 64
printshellcmds: true
rerun-incomplete: true
keep-going: true
show-failed-logs: true
retries: 1
benchmark-extended: true

default-resources:          # fallback for trivial rules
  mem_mb: 2000
  runtime: 30

set-resources:              # from benchmarks/; ENCODE-scale peak sets need ~3x
  prepare_peaks: {mem_mb: 16000}
  filter_rpeaks: {mem_mb: 48000}
  zscore: {mem_mb: 4000}
  call_ccres: {mem_mb: 4000}
  fragment_call_peaks: {mem_mb: 32000}
  fragment_bigwig: {mem_mb: 16000}
