executor: slurm
software-deployment-method:
  - conda
conda-prefix: .conda

jobs: 200
max-jobs-per-second: 5

slurm-efficiency-report: true
slurm-efficiency-report-path: logs/efficiency
slurm-efficiency-threshold: 0.8

default-resources:
  slurm_partition: 30mins
  runtime: 30m
  mem_mb: 2000
  # slurm_extra: "--exclude=node1,node2"   # e.g. nodes missing a shared mount

set-threads:                # also caps polars: rules export POLARS_MAX_THREADS={threads}
  prepare_peaks: 4
  filter_rpeaks: 4
  max_z: 8
  call_ccres: 4

set-resources:              # from benchmarks/; ENCODE-scale peak sets need ~3x
  prepare_peaks:
    mem_mb: 20000 * attempt
  cluster_rpeaks:
    mem_mb: 8000 * attempt
  filter_rpeaks:
    mem_mb: 64000 * attempt
  zscore:
    mem_mb: 4000 * attempt
    runtime: 15m
  max_z:
    mem_mb: 4000 * attempt
  call_ccres:
    mem_mb: 4000 * attempt
  fragment_call_peaks:        # ~1h45m, 11 GB for 319M fragments
    slurm_partition: 12hours
    mem_mb: 24000 * attempt
    runtime: 360m
  fragment_bigwig:
    slurm_partition: 4hours
    mem_mb: 16000 * attempt
    runtime: 60m

rerun-incomplete: true
keep-going: true
show-failed-logs: true
benchmark-extended: true
retries: 1
slurm-requeue: false
printshellcmds: true
latency-wait: 60
