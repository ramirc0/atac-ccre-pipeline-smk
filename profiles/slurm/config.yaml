executor: slurm
software-deployment-method:
  - conda
conda-prefix: .conda

jobs: 200
max-jobs-per-second: 5

slurm-efficiency-report: true
slurm-efficiency-report-path: logs/efficiency
slurm-efficiency-threshold: 0.8

default-resources:
  slurm_partition: 30mins
  runtime: 30m
  mem_mb: 2000
  # slurm_extra: "--exclude=node1,node2"   # e.g. nodes missing a shared mount

set-resources:              # from benchmarks/; ENCODE-scale peak sets need ~3x
  prepare_peaks:
    mem_mb: 16000 * attempt
  cluster_rpeaks:
    mem_mb: 4000 * attempt
  filter_rpeaks:
    mem_mb: 48000 * attempt
  zscore:
    mem_mb: 4000 * attempt
    runtime: 15m
  max_z:
    mem_mb: 4000 * attempt
  call_ccres:
    mem_mb: 4000 * attempt
  fragment_call_peaks:
    slurm_partition: 4hours
    mem_mb: 32000 * attempt
    runtime: 120m
  fragment_bigwig:
    slurm_partition: 4hours
    mem_mb: 16000 * attempt
    runtime: 60m

rerun-incomplete: true
keep-going: true
show-failed-logs: true
benchmark-extended: true
retries: 1
slurm-requeue: false
printshellcmds: true
latency-wait: 60
